<div class="promotion-container">
  <!-- <h2 class="promotion-title">โปรโมชั่นพิเศษ</h2> Removed as per new image which only shows products -->

  <div class="product-grid">
    @for (product of allProducts; track product.product_id) {
    <div class="product-card" (click)="viewProductDetail(product)">

      <div class="product-image-wrapper">
        <div class="discount-badge">ลด 15%</div>
        <img [src]="product.images?.[0]?.image_url || 'https://placehold.co/400x400?text=Product+Image'"
          [alt]="product.name" onerror="this.src='https://placehold.co/400x400?text=Product+Image'">
      </div>

      <div class="product-info">
        <!-- Mock Ratings -->
        <div class="product-rating">
          <div class="stars">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polygon
                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
              </polygon>
            </svg>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polygon
                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
              </polygon>
            </svg>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polygon
                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
              </polygon>
            </svg>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polygon
                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
              </polygon>
            </svg>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polygon
                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
              </polygon>
            </svg>
          </div>
          <span class="rating-count">(12)</span>
        </div>

        <h3 class="product-name">{{ product.name }}</h3>

        <div class="product-pricing">
          <span class="current-price">฿{{ product.price | number:'1.0-0' }}</span>
          <span class="original-price">฿{{ getOriginalPrice(product.price) | number:'1.0-0' }}</span>
        </div>
      </div>

      <div class="product-actions" (click)="$event.stopPropagation()">
        <button class="btn-add-cart" (click)="addToCart(product, $event)">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          เพิ่มลงตะกร้า
        </button>
      </div>
    </div>
    }
  </div>
</div>
