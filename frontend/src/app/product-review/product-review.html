<div class="review-container">
  <h3>เขียนรีวิวให้สินค้านี้</h3>

  <div class="form-group">
    <label>ให้คะแนนความพึงพอใจ:</label>
    <select [(ngModel)]="rating" class="form-control">
      <option value="5">⭐⭐⭐⭐⭐ (5 - ดีมาก)</option>
      <option value="4">⭐⭐⭐⭐ (4 - ดี)</option>
      <option value="3">⭐⭐⭐ (3 - ปานกลาง)</option>
      <option value="2">⭐⭐ (2 - พอใช้)</option>
      <option value="1">⭐ (1 - แย่)</option>
    </select>
  </div>

  <div class="form-group">
    <label>ความคิดเห็นของคุณ:</label>
    <textarea 
      [(ngModel)]="comment" 
      rows="4" 
      class="form-control" 
      placeholder="ประทับใจอะไรในสินค้าชิ้นนี้ เล่าให้เราฟังหน่อย...">
    </textarea>
  </div>

  <button (click)="submitReview()" class="btn-submit">
    ส่งรีวิว
  </button>
</div>
