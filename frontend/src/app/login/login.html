<div class="login-wrapper">
  <div class="login-card">
    <!-- Logo -->
    <div class="logo">
        <i class="bi bi-leaf"></i>
       <span>Kaset<span class="green">Thai</span></span>
    </div>
    <h2>เข้าสู่ระบบ</h2>
  <form (ngSubmit)="login()">
      <label>อีเมล</label>
      <input
        type="email"
        placeholder="กรอกอีเมลของคุณ"
        [(ngModel)]="email"
        name="email"
      />

<div class="mb-3">
  <label>รหัสผ่าน</label>

  <div class="password-box">

    <input
      [type]="showPassword ? 'text' : 'password'"
      placeholder="กรอกรหัสผ่าน"
      [(ngModel)]="password"
      name="password"
      required
    />

    <i
      class="bi eye-icon"
      [class.bi-eye]="!showPassword"
      [class.bi-eye-slash]="showPassword"
      (click)="togglePassword()">
    </i>

  </div>
</div>

      <div class="row">

        <label class="remember">
          <input type="checkbox">จดจำฉัน
        </label>

      </div>
      <button type="submit">เข้าสู่ระบบ</button>
    </form>
    <p class="register">
      ยังไม่มีบัญชี? <a routerLink="/register">สมัครสมาชิก</a>
    </p>

  </div>

</div>
