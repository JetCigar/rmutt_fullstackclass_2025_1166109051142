<div class="login-page">

  <div class="login-card">

    <h2 class="title">เข้าสู่ระบบ</h2>

    <form (submit)="login()">

      <div class="form-group">
        <label>อีเมล</label>
        <input 
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="กรอกอีเมลของคุณ"
        />
      </div>

      <div class="form-group">
        <label>รหัสผ่าน</label>

        <div class="password-input">

          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="กรอกรหัสผ่าน"
          />

          <button
            type="button"
            class="show-password"
            (click)="togglePassword()"
          >
            {{ showPassword ? '🙈' : '👁' }}
          </button>

        </div>
      </div>

      <div class="options">

        <label>
          <input type="checkbox">
          จดจำฉัน
        </label>

        <a routerLink="/">ลืมรหัสผ่าน?</a>

      </div>

      <button class="login-btn">
        เข้าสู่ระบบ
      </button>

    </form>

    <p class="register-text">
      ยังไม่มีบัญชี?
      <a routerLink="/register">สมัครสมาชิก</a>
    </p>

  </div>

</div>
