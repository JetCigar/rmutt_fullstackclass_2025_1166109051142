<!-- ===================== SEARCH PAGE ===================== -->

<!-- กล่องหลักของหน้าค้นหา -->
<div class="search-page">

  <!-- แสดงข้อความหัวข้อ + คำที่ค้นหา -->
  <h2>
    ผลการค้นหา: "{{ query }}"
    <!-- {{ query }} = ดึงค่าตัวแปร query จาก .ts มาแสดง -->
  </h2>


  <!-- ===================== LOADING ===================== -->

  <!-- แสดงข้อความ "กำลังค้นหา..." เมื่อกำลังโหลด -->
  <div *ngIf="loading">
    กำลังค้นหา...
    <!-- *ngIf = เงื่อนไข (ถ้า loading = true ถึงจะแสดง) -->
  </div>


  <!-- ===================== NO RESULT ===================== -->

  <!-- แสดงเมื่อโหลดเสร็จแล้ว แต่ไม่มีสินค้า -->
  <div *ngIf="!loading && products.length === 0">
    ไม่พบสินค้า
    <!-- !loading = โหลดเสร็จแล้ว -->
    <!-- products.length === 0 = ไม่มีข้อมูลสินค้า -->
  </div>


  <!-- ===================== PRODUCT GRID ===================== -->

  <!-- กล่องสำหรับแสดงสินค้าแบบ grid -->
  <div class="product-grid">

    <!-- วนลูปสินค้าแต่ละตัว -->
    <div class="product-card" *ngFor="let p of products">
      <!-- *ngFor = loop array -->
      <!-- let p of products = เอาแต่ละ item ใน products มาเก็บในตัวแปร p -->

      
      <!-- แสดงชื่อสินค้า -->
      <h3>
        {{ p.name }}
        <!-- ดึงชื่อสินค้าจาก object -->
      </h3>


      <!-- แสดงราคา -->
      <p class="price">
        ฿{{ p.price }}
        <!-- ดึงราคาสินค้า -->
      </p>

    </div>

  </div>

</div>
