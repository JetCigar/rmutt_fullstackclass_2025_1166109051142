<!-- ===================== HEADER COMPONENT ===================== -->

<!-- ส่วนหัวของเว็บไซต์ทั้งหมด -->
<header class="header">

<!-- ซ่อน Google Translate (ไว้ใช้ผ่าน script แต่ไม่แสดงบนหน้าเว็บ) -->
<div id="google_translate_element" style="display:none"></div>

  <!-- ===================== TOP BAR ===================== -->
  <div class="header__topbar">

    <!-- ฝั่งซ้าย: แสดงไอคอน + ข้อความ -->
    <div class="header__topbar-left">

      <!-- ไอคอนตำแหน่ง (SVG) -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <!-- รูปหมุด location -->
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
        <!-- จุดวงกลมตรงกลาง -->
        <circle cx="12" cy="10" r="3"/>
      </svg>

      <!-- ข้อความแสดงสถานที่จัดส่ง -->
      <span>ส่งทั่วไทย จากRMUTT:Khlong Hok</span>
    </div>


    <!-- ฝั่งขวา: language + login -->
    <div class="header__topbar-right">

      <!-- กล่องเลือกภาษา + สกุลเงิน -->
      <div class="header__topbar-lang">

        <!-- Language (คลิกแล้วเรียก function switchLanguage) -->
        <span (click)="switchLanguage()" class="lang">
          {{ selectedLang }} <!-- แสดงค่าภาษา เช่น TH / EN -->
        </span>

        <!-- เส้นคั่น -->
        <span class="divider">|</span>

        <!-- Currency (แสดงค่าเงิน เช่น THB) -->
        <span class="currency">
          {{ selectedCurrency }}
        </span>

      </div>

      <!-- เส้นคั่น -->
      <span class="header__topbar-divider">|</span>


      <!-- ===================== LOGIN / REGISTER ===================== -->

      <!-- ถ้ายังไม่ login (isLoggedIn = false) -->
      <div *ngIf="!isLoggedIn" class="auth-links">
        
        <!-- routerLink ใช้เปลี่ยนหน้าโดยไม่ reload -->
        <a routerLink="/login" class="auth-link">เข้าสู่ระบบ</a>

        <!-- เครื่องหมาย / -->
        <span class="slash"> / </span>

        <!-- ไปหน้าสมัครสมาชิก -->
        <a routerLink="/register" class="auth-link">สมัครสมาชิก</a>
      </div>


      <!-- template นี้จะใช้ตอน login แล้ว -->
      <ng-template #loggedInBlock>

        <!-- แสดงชื่อผู้ใช้ -->
        <span class="header__topbar-link">
          สวัสดี {{ username }}
        </span>

        <span>/</span>

        <!-- ปุ่ม logout -->
        <a (click)="logout()" class="header__topbar-link" style="cursor:pointer">
          ออกจากระบบ
        </a>

      </ng-template>

    </div>
  </div>



  <!-- ===================== MAIN HEADER ===================== -->
  <div class="header__main">

    <!-- ===================== LOGO ===================== -->

    <!-- คลิกแล้วกลับหน้า Home -->
    <a routerLink="/" class="header__logo">

      <!-- รูปโลโก้ -->
      <img src="https://cdn-icons-png.flaticon.com/512/4568/4568190.png"
           class="logo-icon"
           alt="sprout icon">

      <!-- ชื่อเว็บไซต์ -->
      <span class="logo-text">

        <!-- คำว่า Kaset สีดำ -->
        <span class="logo-dark">Kaset</span>

        <!-- คำว่า Thai สีเขียว -->
        <span class="logo-green">Thai</span>

      </span>
    </a>



    <!-- ===================== SEARCH ===================== -->

    <div class="header__search">

      <div class="header__search-box">

        <!-- ไอคอนแว่นขยาย -->
        <svg class="header__search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>

        
<!-- ช่อง input สำหรับค้นหา -->
<input
  type="text"
  class="header__search-input"
  placeholder="ค้นหาอุปกรณ์การเกษตร..."
  [(ngModel)]="searchQuery"
  (keydown.enter)="onSearch()"
/>

<!-- two-way binding = input เปลี่ยน -> ตัวแปรเปลี่ยน -->
<!-- กด Enter จะเรียก function onSearch() -->
        <!-- ปุ่มค้นหา -->
        <button class="header__search-btn" (click)="onSearch()">
          ค้นหา
        </button>

      </div>
    </div>



    <!-- ===================== ICONS ===================== -->

    <div class="header__icons">

      <!-- ===================== WISHLIST ===================== -->

      <!-- ปุ่ม wishlist -->
      <button class="header__icon-btn"
              aria-label="Wishlist"
              (click)="onWishlistClick()">
        <!-- เมื่อคลิกจะเรียก function -->

        <!-- ไอคอนรูปหัวใจ -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.8">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>



      <!-- ===================== CART ===================== -->

      <!-- คลิกแล้วไปหน้าตะกร้า -->
      <div class="header__cart" (click)="onCartClick()">

        <!-- กล่องไอคอน -->
        <div class="header__cart-icon-wrap">

          <!-- ไอคอนตะกร้า -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.8">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>

          <!-- badge แสดงจำนวนสินค้า -->
          <span class="header__cart-badge">

            {{ cartService.cartCount() }} 
            <!-- เรียก method จาก CartService เพื่อดึงจำนวนสินค้า -->

          </span>
        </div>


        <!-- ข้อมูลตะกร้า -->
        <div class="header__cart-info">

          <!-- label -->
          <span class="header__cart-label">
            ตะกร้าสินค้า:
          </span>

          <!-- แสดงราคารวม -->
          <span class="header__cart-price">
            {{ cartTotalFormatted }}
          </span>

        </div>

      </div>

    </div>

  </div>

</header>
