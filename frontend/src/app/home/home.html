<div class="home-container container-fluid py-4 px-md-5 bg-light min-vh-100">

  <!-- 1. แบนเนอร์หลัก -->
  <app-hero-banner></app-hero-banner>

  <!-- 2. จุดเด่นของร้าน -->
  <app-feature-bar></app-feature-bar>

  <!-- 3. โปรโมชั่น + นับเวลา -->
  <app-promo-countdown></app-promo-countdown>

  <!-- 4. หมวดหมู่ยอดนิยม -->
  <app-category-grid [categories]="categories" [isLoading]="isLoadingCategories">
  </app-category-grid>

  <!-- 5. สินค้าแนะนำ -->
  <app-product-grid [products]="products" [isLoading]="isLoadingProducts" (addToCart)="addToCart($event)">
  </app-product-grid>

  <!-- 6. รีวิวจากลูกค้า -->

</div>
