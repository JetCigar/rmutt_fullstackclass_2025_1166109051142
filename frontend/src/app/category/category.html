<div class="container">
  <h2>รายการหมวดหมู่สินค้า</h2>
  
  <table class="category-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>ชื่อหมวดหมู่</th>
        <th>รายละเอียด</th>
      </tr>
    </thead>
    <tbody>
      @for (item of categories; track item.category_id) {
        <tr>
          <td>{{ item.category_id }}</td>
          <td><strong>{{ item.name }}</strong></td>
          <td>{{ item.description }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3">ไม่พบข้อมูลหมวดหมู่</td>
        </tr>
      }
    </tbody>
  </table>
</div>
